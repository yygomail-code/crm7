name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Lint PHP
        run: find api -name '*.php' -print0 | xargs -0 -n1 -P4 php -l

  images:
    if: github.ref == 'refs/heads/master'
    needs: [frontend, php]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push images
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -e
          SHA=$(git rev-parse --short HEAD)
          docker build -f deploy/Dockerfile.app -t "ghcr.io/$OWNER/crm7-app:sha-$SHA" .
          docker build -f deploy/Dockerfile.web -t "ghcr.io/$OWNER/crm7-web:sha-$SHA" .
          docker push "ghcr.io/$OWNER/crm7-app:sha-$SHA"
          docker push "ghcr.io/$OWNER/crm7-web:sha-$SHA"

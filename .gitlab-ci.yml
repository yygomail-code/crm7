stages:
  - lint
  - test
  - build

api:lint:
  stage: lint
  image: php:8.3-cli
  script:
    - find api/src api/public api/bin -name '*.php' -print0 | xargs -0 -n1 php -l
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

frontend:check:
  stage: test
  image: node:20
  script:
    - cd frontend
    - npm ci
    - npm run check
    - npm test
  cache:
    key: frontend-$CI_COMMIT_REF_SLUG
    paths:
      - frontend/node_modules/
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

frontend:build:
  stage: build
  image: node:20
  script:
    - cd frontend
    - npm ci
    - npm run build
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
